spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${UJIN_DB_URL:jdbc:postgresql://localhost:5432/ujin}
    username: ${UJIN_DB_USER:ujin}
    password: ${UJIN_DB_PASSWORD:ujin}
  application:
    name: ujin
ujin:
  api:
    base-url: ${UJIN_API_BASE_URL:https://api-uae-test.ujin.tech/api}
    app: ${UJIN_AUTH_APP:}
